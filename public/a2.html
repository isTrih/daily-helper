<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>A2 日报 · 项目快报</title><link rel="stylesheet" href="/styles.css?v=a2-3"></head>
<body class="a2-page"><header class="topbar"><a class="brand" href="/"><span class="brand-mark">D</span><span><strong>Daily Brief</strong><small>项目快报控制台</small></span></a><nav class="report-nav" aria-label="日报类型"><a href="/">项目日报</a><a href="/a2" aria-current="page">A2 日报</a></nav></header>
<main><section class="a2-heading"><h1>A2 日报</h1><p>选一款游戏看近 15 天趋势，选多款看紧凑概览。所有数值以「万」展示。</p></section>
<form id="a2Form" class="workspace"><section class="panel composer"><div class="panel-head"><h2>选择游戏</h2><button id="refreshA2" class="text-button" type="button">刷新</button></div><div id="a2Games" class="a2-games" aria-label="日报游戏"></div><p class="field-hint">单游戏：A2 折线与其他品牌面积图；多游戏：规模、较前日及 7 日变化。</p>
<div class="divider"></div><h2>发送到哪里</h2><div id="a2Chats" class="choice-list"></div><label class="manual-chat"><span>或输入群聊 ID</span><input id="a2ManualChat" type="text" placeholder="oc_xxxxxxxxxxxxxxxx" autocomplete="off"></label><p id="a2ChatHint" class="field-hint"></p>
<div class="a2-actions"><button type="button" id="a2PreviewButton" class="button secondary">预览 A2 日报</button><button type="submit" id="a2SendButton" class="button primary">发送 A2 日报</button></div><p id="a2Notice" class="field-hint" role="status" aria-live="polite">正在读取游戏和群聊…</p></section>
<section class="panel a2-preview-panel" aria-labelledby="a2PreviewTitle"><h2 id="a2PreviewTitle">卡片预览</h2><div id="a2Preview" aria-live="polite"><p class="field-hint">点击预览，读取飞书中的实际数据。</p></div></section>
<section class="panel schedule-center"><h2>A2 每日推送计划</h2><p class="field-hint">使用当前勾选的游戏与一个群聊。A2 计划独立保存和运行。</p><div class="schedule-editor"><label><span>计划名称</span><input id="a2ScheduleName" type="text" maxlength="60" placeholder="例如：四游戏 A2 早报"></label><label><span>北京时间</span><input id="a2ScheduleTime" type="time" value="09:05"></label><label class="schedule-toggle"><input id="a2ScheduleEnabled" type="checkbox" checked><span>保存后启用</span></label><div class="schedule-editor-actions"><button type="button" id="a2CancelEdit" class="button secondary" hidden>取消编辑</button><button type="button" id="a2SaveSchedule" class="button primary">保存 A2 计划</button></div></div><div id="a2Schedules" class="schedule-list"></div></section>
</form></main><script type="module" src="/a2.js?v=4"></script></body></html>
