name: Docker image

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: ${{ vars.DH_USERNAME || github.repository_owner }}
  IMAGE_NAME: ${{ github.event.repository.name }}

jobs:
  docker:
    name: Test, build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare Docker Hub image name
        id: image
        shell: bash
        run: |
          username="${DOCKERHUB_USERNAME,,}"
          image_name="${IMAGE_NAME,,}"
          echo "username=${username}" >> "$GITHUB_OUTPUT"
          echo "name=${username}/${image_name}" >> "$GITHUB_OUTPUT"

      - name: Validate Docker Hub token
        if: github.event_name != 'pull_request'
        env:
          DH_TOKEN: ${{ secrets.DH_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$DH_TOKEN" ]]; then
            echo "Missing repository secret: DH_TOKEN" >&2
            exit 1
          fi

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ steps.image.outputs.username }}
          password: ${{ secrets.DH_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
